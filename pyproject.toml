[project]
name = "asr-benchmark"
version = "0.1.0"
description = "Benchmark ASR accuracy and inference speed"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.6.17",
    "cryptography>=49.0.0",
    "doubaoime-asr",
    "openai>=2.15.0",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "transformers>=5.13.0",
]

[project.scripts]
asr-benchmark = "asr_benchmark.benchmark:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=3.0.0",
    "pylint>=4.0.6",
    "pyright>=1.1.411",
]

[project.optional-dependencies]
funasr = [
    "funasr>=1.4.2,<1.5",
    "miniaudio>=1.61",
    "mlx>=0.25.2,<=0.29.3",
    "mlx-audio-plus",
    "torchaudio>=2.10.0",
]
fireredasr2s = [
    "fireredasr2s",
    "huggingface-hub>=1.26.0",
    "kaldi-native-fbank>=1.22.3",
    "sherpa-onnx>=1.12.27,<1.13",
    "sherpa-onnx-core>=1.12.27,<1.13",
]

[tool.uv]
override-dependencies = ["transformers>=5.13.0"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "doubaoime_asr",
    "fireredasr2s.*",
    "funasr",
    "mlx",
    "mlx.*",
    "mlx_audio.*",
    "sherpa_onnx",
    "soundfile",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "SIM",
]
ignore = [
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.vulture]
paths = ["src"]
min_confidence = 60
sort_by_size = true

[tool.pylint.design]
max-attributes = 8
max-locals = 16

[tool.pylint."messages control"]
disable = [
    "broad-exception-caught",
    "duplicate-code",
    "import-outside-toplevel",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "unnecessary-ellipsis",
]

[tool.uv.sources]
doubaoime-asr = { git = "https://github.com/GreenHatHG/doubaoime-asr.git", rev = "047da05124861e3031ac802f9275273e498a5438" }
fireredasr2s = { git = "https://github.com/FireRedTeam/FireRedASR2S.git", rev = "4e7d9aaf4482a47cec1724807026b9b151926eb5" }
mlx-audio-plus = { git = "https://github.com/DePasqualeOrg/mlx-audio-plus.git", rev = "4c9ec6a8489e790b5ba8964ab1f1d63150476f9f" }
